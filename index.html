<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NutriCalc BR</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0f172a; color: #f8fafc; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
    </style>
</head>
<body class="min-h-screen pb-24 p-4">
    <div class="max-w-md mx-auto space-y-4">
        <h1 class="text-xl font-bold text-white">NutriCalc <span class="text-green-500">BR</span></h1>
        <div class="bg-slate-800 p-4 rounded-xl space-y-3">
            <h2 class="font-bold text-sm">Dados Biométricos</h2>
            <div>
                <label class="text-xs text-slate-400">Peso (kg)</label>
                <input type="number" step="0.1" id="peso" value="75.0" class="w-full bg-slate-900 p-2 rounded text-white">
            </div>
            <div>
                <label class="text-xs text-slate-400">Altura (cm)</label>
                <input type="number" id="altura" value="175" class="w-full bg-slate-900 p-2 rounded text-white">
            </div>
            <div>
                <label class="text-xs text-slate-400">Idade</label>
                <input type="number" id="idade" value="28" class="w-full bg-slate-900 p-2 rounded text-white">
            </div>
            <button onclick="calcular()" class="w-full bg-green-600 text-white font-bold p-3 rounded-xl">Calcular Metas</button>
        </div>
        <div class="bg-slate-800 p-4 rounded-xl space-y-2">
            <h2 class="font-bold text-sm">Resultados</h2>
            <p>TMB: <span id="resTMB">--</span></p>
            <p>GET: <span id="resGET">--</span></p>
        </div>
    </div>
    <script>
        function calcular() {
            let peso = parseFloat(document.getElementById('peso').value) || 75;
            let altura = parseFloat(document.getElementById('altura').value) || 175;
            let idade = parseFloat(document.getElementById('idade').value) || 28;
            let tmb = (10 * peso) + (6.25 * altura) - (5 * idade) + 5;
            let get = Math.round(tmb * 1.55);
            document.getElementById('resTMB').innerText = Math.round(tmb) + ' kcal';
            document.getElementById('resGET').innerText = get + ' kcal';
        }
    </script>
</body>
</html>
