<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NutriCalc BR - Calculadora e Refeições</title>
    <!-- Configurações PWA para iPhone/Android -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="NutriCalc BR">
    <link rel="manifest" href="data:application/manifest+json;charset=utf-8,%7B%22name%22%3A%22NutriCalc%20BR%22%2C%22short_name%22%3A%22NutriCalc%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%230f172a%22%2C%22theme_color%22%3A%22%2316a34a%22%7D">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0f172a; color: #f8fafc; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        input[type="number"]::-webkit-inner-spin-button, input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        .card-glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
    </style>
</head>
<body class="min-h-screen pb-24">

    <!-- Header / Nav Superior -->
    <header class="sticky top-0 z-50 card-glass border-b border-slate-800 px-4 py-3 shadow-lg">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <div class="bg-green-600 text-white p-2 rounded-xl shadow-md"><i class="fa-solid fa-utensils"></i></div>
                <h1 class="text-lg font-bold tracking-tight text-white">NutriCalc <span class="text-green-500">BR</span></h1>
            </div>
            <div class="flex items-center space-x-1">
                <!-- Backup Botões -->
                <button onclick="exportData()" title="Salvar Backup" class="p-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg text-xs flex items-center gap-1 transition"><i class="fa-solid fa-download"></i></button>
                <label title="Restaurar Backup" class="p-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg text-xs flex items-center gap-1 cursor-pointer transition">
                    <i class="fa-solid fa-upload"></i>
                    <input type="file" id="importFile" onchange="importData(event)" class="hidden" accept=".json">
                </label>
                <button onclick="openInfoModal()" class="p-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg text-xs transition"><i class="fa-solid fa-circle-info"></i></button>
            </div>
        </div>
    </header>

    <!-- Conteúdo Principal -->
    <main class="max-w-md mx-auto p-4 space-y-4">

        <!-- ABA 1: PERFIL & METAS -->
        <section id="tab-perfil" class="tab-content active space-y-4">
            <div class="card-glass rounded-2xl p-5 shadow-xl">
                <h2 class="text-base font-bold text-white mb-3 flex items-center gap-2"><i class="fa-solid fa-user-gear text-green-500"></i> Seus Dados Biométricos</h2>
                <div class="space-y-3 text-sm">
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-slate-400 text-xs mb-1 font-medium">Sexo</label>
                            <select id="sexo" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-white focus:outline-none focus:border-green-500">
                                <option value="masculino">Masculino</option>
                                <option value="feminino">Feminino</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-slate-400 text-xs mb-1 font-medium">Idade (anos)</label>
                            <input type="number" id="idade" value="28" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-white focus:outline-none focus:border-green-500">
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-slate-400 text-xs mb-1 font-medium">Peso atual (kg)</label>
                            <input type="number" step="0.1" id="peso" value="75.0" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-white focus:outline-none focus:border-green-500">
                        </div>
                        <div>
                            <label class="block text-slate-400 text-xs mb-1 font-medium">Altura (cm)</label>
                            <input type="number" id="altura" value="175" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-white focus:outline-none focus:border-green-500">
                        </div>
                    </div>
                    <div>
                        <label class="block text-slate-400 text-xs mb-1 font-medium">Nível de Atividade Física</label>
                        <select id="atividade" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-white focus:outline-none focus:border-green-500">
                            <option value="1.2">Sedentário (pouco ou nenhum exercício)</option>
                            <option value="1.375">Levemente ativo (exercício leve 1-3 dias/sem)</option>
                            <option value="1.55" selected>Moderadamente ativo (exercício 3-5 dias/sem)</option>
                            <option value="1.725">Muito ativo (exercício 6-7 dias/sem)</option>
                            <option value="1.9">Extremamente ativo (trabalho físico pesado)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-slate-400 text-xs mb-1 font-medium">Objetivo</label>
                        <select id="objetivo" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-white focus:outline-none focus:border-green-500">
                            <option value="-500">Emagrecimento (-500 kcal)</option>
                            <option value="0" selected>Manutenção do Peso</option>
                            <option value="300">Hipertrofia Leve (+300 kcal)</option>
                            <option value="500">Hipertrofia / Ganho de Massa (+500 kcal)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-slate-400 text-xs mb-1 font-medium">Estratégia de Macronutrientes</label>
                        <select id="estrategiaMacro" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-white focus:outline-none focus:border-green-500">
                            <option value="peso">Por Peso (2.0g/kg Proteína | 1.0g/kg Gordura)</option>
                            <option value="equilibrada" selected>Equilibrada (35% P / 45% C / 20% G)</option>
                            <option value="lowcarb">Low Carb (40% P / 20% C / 40% G)</option>
                            <option value="performance">Alta Performance (30% P / 55% C / 15% G)</option>
                        </select>
                    </div>
                    <button onclick="calcularTudo()" class="w-full bg-green-600 hover:bg-green-500 text-white font-bold p-3 rounded-xl shadow-lg transition active:scale-95"><i class="fa-solid fa-calculator mr-2"></i> Calcular Metas</button>
                </div>
            </div>

            <!-- Resultados do Cálculo -->
            <div id="resultadoCard" class="card-glass rounded-2xl p-5 shadow-xl space-y-4">
                <h2 class="text-base font-bold text-white flex items-center gap-2"><i class="fa-solid fa-chart-pie text-green-500"></i> Suas Metas Diárias</h2>
                <div class="grid grid-cols-2 gap-3 text-center">
                    <div class="bg-slate-900/60 p-3 rounded-xl border border-slate-800">
                        <span class="text-xs text-slate-400 block">TMB (Basal)</span>
                        <span id="resTMB" class="text-lg font-bold text-slate-200">-- kcal</span>
                    </div>
                    <div class="bg-slate-900/60 p-3 rounded-xl border border-slate-800">
                        <span class="text-xs text-slate-400 block">Gasto Total (GET)</span>
                        <span id="resGET" class="text-lg font-bold text-slate-200">-- kcal</span>
                    </div>
                </div>
                <div class="bg-gradient-to-r from-green-900/30 to-emerald-900/30 border border-green-700/40 p-4 rounded-xl text-center">
                    <span class="text-xs text-green-400 font-semibold uppercase
